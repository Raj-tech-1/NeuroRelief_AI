<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" fill="none">
  <defs>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="0.55" stop-color="#FDE6EF" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#FBD0E1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F9B4CF"/>
      <stop offset="1" stop-color="#E0679D"/>
    </linearGradient>
    <linearGradient id="leafSoft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FDE0EA"/>
      <stop offset="1" stop-color="#F6AACA"/>
    </linearGradient>
    <linearGradient id="leafDeep" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EE8BB5"/>
      <stop offset="1" stop-color="#B83280"/>
    </linearGradient>
    <linearGradient id="petal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F48FB9"/>
      <stop offset="1" stop-color="#A62D73"/>
    </linearGradient>
    <linearGradient id="petalSide" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBC3D8"/>
      <stop offset="1" stop-color="#D9579A"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.85" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="1" stop-color="#FCE8F1" stop-opacity="1"/>
    </linearGradient>
    <!-- leaf shapes: base at the origin, pointing right -->
    <g id="lf"><path d="M0 0C18-24 52-30 84-14 60 8 26 14 0 0Z" fill="url(#leaf)"/><path d="M3 0C28-8 52-12 78-14" stroke="#FFFFFF" stroke-opacity=".5" stroke-width="1.6" stroke-linecap="round"/></g>
    <g id="lfs"><path d="M0 0C18-24 52-30 84-14 60 8 26 14 0 0Z" fill="url(#leafSoft)"/><path d="M3 0C28-8 52-12 78-14" stroke="#FFFFFF" stroke-opacity=".6" stroke-width="1.4" stroke-linecap="round"/></g>
    <g id="lfd"><path d="M0 0C18-24 52-30 84-14 60 8 26 14 0 0Z" fill="url(#leafDeep)"/><path d="M3 0C28-8 52-12 78-14" stroke="#FFFFFF" stroke-opacity=".4" stroke-width="1.6" stroke-linecap="round"/></g>
  </defs>

  <!-- soft light -->
  <circle cx="330" cy="330" r="270" fill="url(#glow)"/>
  <circle cx="470" cy="150" r="70" fill="#FFFFFF" opacity=".35"/>
  <circle cx="160" cy="470" r="46" fill="#FFFFFF" opacity=".35"/>

  <!-- main branch rising from the bottom and arching left -->
  <path d="M430 700C420 600 392 520 350 450 306 376 250 320 170 278 120 252 80 244 40 246" stroke="#E98DB6" stroke-width="4" stroke-linecap="round"/>
  <use href="#lfd" transform="translate(422 640) rotate(-70) scale(1.1)"/>
  <use href="#lf" transform="translate(414 600) rotate(-150) scale(1)"/>
  <use href="#lfs" transform="translate(396 548) rotate(-60) scale(.95)"/>
  <use href="#lf" transform="translate(380 512) rotate(-160) scale(1.05)"/>
  <use href="#lfd" transform="translate(356 462) rotate(-50) scale(.9)"/>
  <use href="#lfs" transform="translate(334 432) rotate(-170) scale(1)"/>
  <use href="#lf" transform="translate(300 392) rotate(-45) scale(.9)"/>
  <use href="#lfd" transform="translate(272 364) rotate(165) scale(.95)"/>
  <use href="#lfs" transform="translate(236 336) rotate(-55) scale(.85)"/>
  <use href="#lf" transform="translate(204 312) rotate(150) scale(.85)"/>
  <use href="#lfs" transform="translate(168 290) rotate(-70) scale(.75)"/>
  <use href="#lfd" transform="translate(130 270) rotate(140) scale(.7)"/>
  <use href="#lf" transform="translate(90 256) rotate(-80) scale(.6)"/>
  <use href="#lfs" transform="translate(52 250) rotate(165) scale(.55)"/>

  <!-- second, thinner branch on the right -->
  <path d="M520 700C530 610 552 520 548 430 544 350 520 290 530 200 536 150 556 110 572 80" stroke="#F3A9C9" stroke-width="3" stroke-linecap="round"/>
  <use href="#lfs" transform="translate(528 620) rotate(-120) scale(.8)"/>
  <use href="#lf" transform="translate(540 560) rotate(-30) scale(.75)"/>
  <use href="#lfs" transform="translate(549 480) rotate(-140) scale(.8)"/>
  <use href="#lfd" transform="translate(546 410) rotate(-35) scale(.7)"/>
  <use href="#lfs" transform="translate(534 330) rotate(-150) scale(.75)"/>
  <use href="#lf" transform="translate(526 260) rotate(-40) scale(.7)"/>
  <use href="#lfs" transform="translate(532 190) rotate(-150) scale(.65)"/>
  <use href="#lfd" transform="translate(552 130) rotate(-50) scale(.6)"/>
  <use href="#lfs" transform="translate(566 92) rotate(-140) scale(.5)"/>

  <!-- lotus resting in the light -->
  <g transform="translate(300 600)">
    <ellipse cx="0" cy="22" rx="150" ry="18" fill="#F9C9DC" opacity=".55"/>
    <path d="M-150 18C-110 6-70 4-40 10" stroke="#FFFFFF" stroke-opacity=".8" stroke-width="2" stroke-linecap="round"/>
    <path d="M0 10C-44 4-92-16-116-50-70-58-24-36 0 10Z" fill="url(#petalSide)" opacity=".9"/>
    <path d="M0 10C44 4 92-16 116-50 70-58 24-36 0 10Z" fill="url(#petalSide)" opacity=".9"/>
    <path d="M0 10C-30-4-58-40-62-84-24-74 0-40 0 10Z" fill="url(#petal)" opacity=".85"/>
    <path d="M0 10C30-4 58-40 62-84 24-74 0-40 0 10Z" fill="url(#petal)" opacity=".85"/>
    <path d="M0 12C-22-20-26-76 0-124 26-76 22-20 0 12Z" fill="url(#petal)"/>
    <path d="M0 4C-6-30-6-70 0-110" stroke="#FFFFFF" stroke-opacity=".45" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- drifting petals -->
  <use href="#lf" transform="translate(120 120) rotate(-25) scale(.7)"/>
  <use href="#lfs" transform="translate(250 90) rotate(20) scale(.55)"/>
  <use href="#lfd" transform="translate(400 210) rotate(-15) scale(.5)"/>
  <use href="#lfs" transform="translate(80 420) rotate(30) scale(.6)"/>
  <use href="#lf" transform="translate(190 540) rotate(-35) scale(.5)"/>

  <!-- sparkles -->
  <path d="M200 180l3 9 9 3-9 3-3 9-3-9-9-3 9-3z" fill="#F07AAE" opacity=".6"/>
  <path d="M440 300l2 6 6 2-6 2-2 6-2-6-6-2 6-2z" fill="#F07AAE" opacity=".5"/>
  <path d="M110 360l2 6 6 2-6 2-2 6-2-6-6-2 6-2z" fill="#F07AAE" opacity=".5"/>
  <path d="M360 120l2 6 6 2-6 2-2 6-2-6-6-2 6-2z" fill="#F07AAE" opacity=".45"/>

  <!-- gentle waves at the bottom -->
  <path d="M0 660C120 624 240 634 330 660 430 690 520 684 600 652V700H0Z" fill="#FFFFFF" opacity=".55"/>
  <path d="M0 628C140 590 260 608 360 646 460 684 540 674 600 638" stroke="#FFFFFF" stroke-opacity=".8" stroke-width="3"/>
  <rect width="600" height="700" fill="url(#fade)"/>
</svg>
